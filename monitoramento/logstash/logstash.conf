input {
    tcp {
        port => 5044
        codec => json_lines
    }
}

filter {
    mutate {
        add_field => { "ambiente" => "laboratorio-desenvolvimento" }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "portalweb-logs-%{+YYYY.MM.dd}"
    }
    stdout => { codec => rubydebug }
}